name: FunstayBackend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Backend Files
        run: |
          rsync -avz --delete \
          -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
          ./ \
          root@${{ secrets.SERVER_IP }}:/var/www/html/funstaybackend/

      - name: Install Dependencies and Restart Backend
        run: |
          ssh -i ~/.ssh/id_ed25519 \
          -o StrictHostKeyChecking=no \
          root@${{ secrets.SERVER_IP }} \
          "cd /var/www/html/funstaybackend && npm install && pm2 delete funstaybackend || true && pm2 start index.js --name funstaybackend && pm2 save"
          